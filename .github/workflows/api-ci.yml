# ==============================================================================
# API CI（Go バックエンド）
#
# - PR / push: go build + vet + test
# - develop への push: arm64 でビルドできるか + ECR にログインできるかを確認
#   （ECR へは push しない。ECR に置くのはリリース版のイメージだけ。
#     「最新 5 件を保持」=「直近 5 リリース」という状態を保つため）
# リリース（自動デプロイ）は api-cd.yml（v* タグの push で起動）が行う。
# このファイルは「検査」までを担当する。
#
# 前提（初回のみ）:
#   1. terraform を shared → compute の順に apply（OIDC Provider は shared が作る）
#   2. GitHub Secrets に AWS_ROLE_ARN_API_DEV を登録
#      （値は terraform/compute の output github_actions_api_role_arn）
# ==============================================================================

name: API CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # ビルドとテスト（認証情報なし）
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # ---------------------------------------------------------------------------
  # ビルド検証（develop への push のみ）
  #
  # arm64 でビルドできることと、OIDC ロールで ECR にログインできることを確認する。
  # イメージは push しない（ECR に置くのはリリース版だけ。最新 5 件 = 直近 5 リリース）。
  # ECS への反映（デプロイ）は api-cd.yml（v* タグの push）が行う
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: flashbuy-api-dev
    steps:
      - uses: actions/checkout@v4

      # Dockerfile は config-prod.yaml を COPY する。
      # 中身は ECS の環境変数で上書きされるため、雛形をコピーするだけでよい
      - name: Prepare config file
        run: cp api/config-prod.yaml.example api/config-prod.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_API_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      # ランナーは amd64、イメージは arm64。
      # ランタイムステージの apk add を動かすのに QEMU によるエミュレーションが必要
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # push しない（ECR に置くのはリリース版だけ）。ビルドが通ることと
      # ECR へのログインが通ることを確認するのが目的
      - name: Build (verification only, no push)
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64
          push: false
          load: false
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:ci
          # ビルドキャッシュを GitHub Actions のキャッシュに保存して、次回以降の
          # ビルドを短縮する（scope 固定でブランチ/タグをまたいで共有される）
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
