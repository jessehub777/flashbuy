# ==============================================================================
# Lambda CI（lottery_drawer / order_expirer）
#
# - PR / push: build.sh（中で go test も走る）→ zip を artifact に保存
#
# リリース（自動デプロイ）は lambda-cd.yml（v* タグの push で起動）が行う。
# ここでは AWS の認証情報を一切使わない（zip を作って保存するだけ）。
# ==============================================================================

name: Lambda CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'lambdas/**'
      - '.github/workflows/lambda-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'lambdas/**'
      - '.github/workflows/lambda-ci.yml'

permissions:
  contents: read

concurrency:
  group: lambda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # ビルドとテスト（認証情報なし）
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            lambdas/lottery_drawer/go.sum
            lambdas/order_expirer/go.sum

      # build.sh の中で go test ./... も実行される
      - name: Build lottery_drawer
        run: bash lambdas/lottery_drawer/build.sh

      - name: Build order_expirer
        run: bash lambdas/order_expirer/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zips
          path: |
            lambdas/lottery_drawer/dist/lottery_drawer.zip
            lambdas/order_expirer/dist/order_expirer.zip
          retention-days: 1
